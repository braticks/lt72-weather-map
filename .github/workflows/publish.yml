name: Publish release and integration icon
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "custom_components/lt72_weather_map/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'braticks/lt72-weather-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local Home Assistant brand icons from bundled SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          from pathlib import Path
          from cairosvg import svg2png
          src = Path("custom_components/lt72_weather_map/www/icon.svg")
          dst = Path("custom_components/lt72_weather_map/brand")
          dst.mkdir(exist_ok=True)
          svg = src.read_bytes()
          for name, size in (("icon.png", 256), ("icon@2x.png", 512)):
              svg2png(bytestring=svg, write_to=str(dst / name),
                      output_width=size, output_height=size)
              assert (dst / name).read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          print("Brand icons generated.")
          PY
      - name: Commit PNG icons into main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/lt72_weather_map/brand/icon.png custom_components/lt72_weather_map/brand/icon@2x.png
          if ! git diff --cached --quiet; then
            git commit -m "Add native Home Assistant integration icon assets"
            git push origin HEAD:main
          fi
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/lt72_weather_map/manifest.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "LT72 Weather Map $TAG" \
            --notes "LT72 Weather Map $TAG: animated interpolated Open-Meteo wind particles, optional dashboard-device geolocation marker (permission and HTTPS required), adjustable particle density, RainViewer precipitation radar, snow overlays and Lithuanian LT72 alert counties. Includes native Home Assistant icon. Unofficial preview: NOT a replacement for emergency alerts."
